rules:
  - id: weixin-node-gcm-auth-tag-length
    languages: [javascript, typescript]
    message: AES-GCM decipher must explicitly enforce the 16-byte authentication tag.
    severity: ERROR
    patterns:
      - pattern: crypto.createDecipheriv($ALG, $KEY, $IV)
      - metavariable-regex:
          metavariable: $ALG
          regex: "[\\\"']aes-(128|192|256)-gcm[\\\"']"
    paths:
      include:
        - '**/cloudbase/cloudfunctions/**/*.js'
        - '**/cloudbase/cloudfunctions/**/*.cjs'
  - id: weixin-node-child-process-shell
    languages: [javascript, typescript]
    message: Avoid shell-enabled child process execution with request-derived values.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: child_process.exec($CMD, ...)
          - pattern: exec($CMD, ...)
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern: $INPUT
            - metavariable-regex:
                metavariable: $INPUT
                regex: .*(req|request|event|query|body|params).*
    paths:
      include:
        - '**/cloudbase/cloudfunctions/**/*.js'
        - '**/cloudbase/cloudfunctions/**/*.cjs'
