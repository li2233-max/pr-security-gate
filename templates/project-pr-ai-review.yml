name: PR AI Security Review

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-ai-review-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  security-review:
    name: pr-security-gate
    uses: li2233-max/pr-security-gate/.github/workflows/pr-ai-review.yml@v4
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
